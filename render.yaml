# Para serviços criados/sincronizados por Blueprint.
# Em um serviço existente, configure também o Build Command no painel (README).
services:
  - type: web
    name: cortavideo
    runtime: python
    plan: free
    buildCommand: python -m pip install -r requirements.txt && python preparar_youtube.py && python preparar_modelo.py
    startCommand: python app.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: WHISPER_MODEL
        value: tiny
      - key: LOW_MEMORY_MODE
        value: "1"
      - key: NODE_VERSION
        value: 22.22.0
